[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "audiogen-eval-protocols"
version = "0.0.0"
description = "Typed, YAML-configured evaluation protocols for audio generation models."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audiogen_eval_protocols = ["protocols/*.yaml", "protocols/*/*.yaml"]
